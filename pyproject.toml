[project]
name = "pdf-to-md"
version = "0.1.0"
description = "Convert PDF files to Markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docling>=2.80.0",
  "fastapi>=0.135.1",
  "pydantic>=2.12.5",
  "python-multipart>=0.0.22",
  "uvicorn>=0.42.0",
]

[project.scripts]
pdf-to-md = "pdf_to_md.cli:main"
pdf-to-md-server = "pdf_to_md.server:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration tests (require real fixtures)",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.19.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.6",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TC",  # flake8-type-checking
]
ignore = [
  "E501", # line too long (handled by formatter)
]
[tool.ruff.lint.isort]
known-first-party = ["pdf_to_md"]
