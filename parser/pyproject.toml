[tool.uv]
package = true

[project]
name = "parser"
version = "0.1.0"
description = "Stateless document parser service: converts PDF bytes to markdown via docling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docling>=2.80.0",
  "grpcio>=1.62.0",
  "grpcio-tools>=1.62.0",
  "protobuf>=4.25.0",
]

[project.scripts]
parser = "parser.cli:main"
parser-server = "parser.server:serve"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration tests (require real fixtures)",
]

[dependency-groups]
dev = ["mypy>=1.15.0", "pytest>=8.0.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/parser/grpc/"]
[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TC"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["parser"]
