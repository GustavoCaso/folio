[tool.uv]
package = true
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project]
name = "parser"
version = "0.1.0"
description = "Stateless document parser service: converts PDF bytes to markdown via docling"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "docling-slim[format-pdf,feat-ocr-rapidocr,format-office,format-web,format-latex,feat-chunking,extract-core,feat-ocr-rapidocr-onnx,models-local,cli]==2.93.0",
  "grpcio==1.80.0",
  "grpcio-health-checking==1.71.2",
  "grpcio-tools==1.71.2",
  "protobuf==5.29.6",
]

[project.scripts]
parser = "parser.cli:main"
parser-server = "parser.server:serve"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration tests (require real fixtures)",
]

[dependency-groups]
dev = [
  "grpc-stubs==1.53.0.6",
  "mypy==1.20.0",
  "protoletariat==3.3.10",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.10",
  "types-protobuf==7.34.1.20260408",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/parser/grpc/"]

[[tool.mypy.overrides]]
module = "parser.grpc.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pypdfium2"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/parser/grpc/"]
[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TC"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["parser"]
