[tool.uv]
package = true

[project]
name = "parser"
version = "0.1.0"
description = "Stateless document parser service: converts PDF bytes to markdown via docling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docling==2.86.0",
  "grpcio==1.80.0",
  "grpcio-tools==1.71.2",
  "protobuf==5.29.6",
]

[project.scripts]
parser = "parser.cli:main"
parser-server = "parser.server:serve"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration tests (require real fixtures)",
]

[dependency-groups]
dev = [
    "mypy==1.20.0",
    "protoletariat==3.3.10",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.10",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/parser/grpc/"]
[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TC"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["parser"]
